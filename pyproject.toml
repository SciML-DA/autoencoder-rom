[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoencoder-rom"
version = "0.1.0"
description = "Autoencoder and POD reduced-order models for fluid snapshot data"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Lukas Campbell"}
]
keywords = ["reduced-order-modelling", "autoencoder", "proper-orthogonal-decomposition", "echo-state-network"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # the modelling core and the reservoir, split out of A. Nóvoa's romda
    # repo into standalone packages. These replace what used to be vendored
    # here as src/models/{model,history,integrator}.py and tools/esn_core.py.
    "dynamodels>=0.4.1,<1.0",
    "echostatenetwork[opt]>=0.1.2,<1.0",
    "h5py>=3.14,<4.0",
    "matplotlib>=3.9,<4.0",
    "numba==0.64.0",
    "numpy>=2.0,<3.0",
    "pyts>=0.13",
    "requests>=2.32",
    "scipy>=1.13,<2.0",
    "seaborn>=0.13",
    "tabulate>=0.9",
    "tqdm>=4.67",
    "torch>=2.2,<2.3; python_version < '3.13'",
    "torch>=2.9,<2.13; python_version >= '3.13'",
    "torchvision>=0.17,<0.18; python_version < '3.13'",
    "torchvision>=0.24,<0.25; python_version >= '3.13'",
    "torchaudio>=2.2,<2.3; python_version < '3.13'",
    "torchaudio>=2.9,<2.13; python_version >= '3.13'",
    "typeguard",
    "ipython-genutils>=0.2",
    "modulo-vki>=2.1",
    "pyqt5>=5.15",
    "wandb",
    "ipykernel>=6.30",
    "ipywidgets>=8.1",
    "jupyter>=1.1",
    "torch>=2.2.2",
    # torch's linux wheel bundles CUDA, jax's does not -- plain `jax` is the
    # CPU build, and it falls back silently, so AEJax/CAEJax would time a CPU
    # against torch's GPU inside the same job. no CUDA wheels exist for macOS,
    # hence the split rather than one line.
    # the py<3.13 branch above pins torch 2.2, which needs cudnn 8.9, while
    # jax[cuda12] needs cudnn >=9.8 -- so the CUDA build is gated to 3.13+ too.
    # that branch is unreachable in practice (the venv is 3.13, torch 2.9).
    "jax[cuda12]>=0.11.0; sys_platform == 'linux' and python_version >= '3.13'",
    "jax>=0.11.0; sys_platform != 'linux' or python_version < '3.13'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4"
]

[project.urls]
# The model layer, ESN reservoir and parts of utils.py originate here
"Upstream (A. Nóvoa)" = "https://github.com/andreanovoa/real-time-bias-aware-DA"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]

[tool.mypy]
python_version = "3.14.3"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
] 
